name: Test and verify the Dinner Club
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patto-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Verify the real public website matches main branch and all six meal photos
        if: github.event_name != 'pull_request'
        run: node scripts/verify-live-images.mjs
