name: Cache November family meal photographs
on:
  push:
    paths:
      - .github/workflows/cache-november-photos.yml

permissions:
  contents: write

jobs:
  cache-six-meal-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download openly licensed recipe photos
        run: node scripts/cache-november-photos.mjs
      - name: Commit food photography into site assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meal-photos/nov-2026/
          git diff --cached --quiet || git commit -m "Store six November meal photographs [skip ci]"
          git push
