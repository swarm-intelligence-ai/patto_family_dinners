name: Verify actual live dinner images
on:
  push:
    paths:
      - .github/workflows/verify-live-images.yml
      - scripts/verify-live-images.mjs
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect active GitHub Pages publishing source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/pages" | jq '{build_type,source,status,html_url,message}'
      - name: Compare live published HTML, JS and six photo files with GitHub repository
        run: node scripts/verify-live-images.mjs
